<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detail Dokumentasi - IRODA</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/event-detail.css"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- =========================
         CONTENT
    ========================= -->

    <main>


        <!-- =========================
             EVENT HEADER
        ========================= -->

        <section class="event-header">

    <!-- FOTO EVENT -->
    <div
        id="eventImageContainer"
        class="event-image-container"
    ></div>


    <!-- OVERLAY -->
    <div class="event-image-overlay"></div>


    <!-- TOMBOL KEMBALI -->
    <a
        href="javascript:history.back()"
        class="close-button"
        aria-label="Kembali"
        title="Kembali"
    >
        <i class="fa-solid fa-xmark"></i>
    </a>


    <!-- HERO CONTENT -->
    <div class="hero-content">

        <span class="hero-label">
            DOKUMENTASI KEGIATAN
        </span>


        <h1 id="eventName">
            Memuat...
        </h1>


        <p id="eventYear">
            -
        </p>

    </div>

        </section>



        <!-- =========================
             DESKRIPSI
        ========================= -->

        <section class="description-card">


            <span class="section-label">

                TENTANG KEGIATAN

            </span>


            <h2>

                Deskripsi

            </h2>


            <p id="eventDescription">

                Memuat deskripsi...

            </p>


        </section>



        <!-- =========================
             DOKUMENTASI
        ========================= -->

        <section class="dates-section">


            <div class="section-header">


                <span class="section-label">

                    DOKUMENTASI

                </span>


                <h2>

                    Tanggal Kegiatan

                </h2>


                <p>

                    Pilih tanggal untuk membuka
                    dokumentasi Google Drive.

                </p>


            </div>



            <!-- =========================
                 LIST TANGGAL
            ========================= -->

            <div
                id="dateList"
                class="date-list"
            >

                <div class="loading">

                    Memuat tanggal...

                </div>

            </div>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 IRODA

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script
        src="js/event-detail.js"
    ></script>


</body>

</html>
