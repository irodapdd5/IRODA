<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detail Dokumentasi - IRODA</title>

    <link
        rel="stylesheet"
        href="css/event-detail.css"
    >

</head>


<body>


<!-- =========================
     NAVBAR PUBLIC
========================= -->

<header class="navbar">

    <a
        href="index.html"
        class="brand"
    >

        <img
            src="assets/images/logo.png"
            alt="Logo IRODA"
        >

        <div class="brand-text">

            <strong>
                IRODA
            </strong>

            <span>
                IKATAN REMAJA RT02
            </span>

        </div>

    </a>


    <nav>

        <a href="index.html">
            Beranda
        </a>

        <a href="dokumentasi.html">
            Hasil Dokumentasi
        </a>

    </nav>

</header>



<!-- =========================
     CONTENT
========================= -->

<main>


    <!-- HEADER EVENT -->

    <section class="event-header">

        <a
            href="javascript:history.back()"
            class="back-button"
        >
            ← Kembali
        </a>


        <span class="section-label">
            DOKUMENTASI KEGIATAN
        </span>


        <h1 id="eventName">
            Memuat...
        </h1>


        <p id="eventYear">
            -
        </p>

    </section>



    <!-- =========================
         DESKRIPSI
    ========================= -->

    <section class="description-card">

        <span class="section-label">
            TENTANG KEGIATAN
        </span>


        <h2>
            Deskripsi
        </h2>


        <p id="eventDescription">
            Memuat deskripsi...
        </p>

    </section>



    <!-- =========================
         TANGGAL
    ========================= -->

    <section class="dates-section">

        <div class="section-header">

            <span class="section-label">
                DOKUMENTASI
            </span>


            <h2>
                Tanggal Kegiatan
            </h2>


            <p>
                Pilih tanggal untuk membuka
                dokumentasi Google Drive.
            </p>

        </div>


        <div
            id="dateList"
            class="date-list"
        >

            <div class="loading">
                Memuat tanggal...
            </div>

        </div>

    </section>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 IRODA — Ikatan Remaja RT02

</footer>



<script src="js/event-detail.js"></script>

</body>

</html>
