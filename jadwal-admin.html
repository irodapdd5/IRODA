<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jadwal Kegiatan - Dashboard IRODA</title>

    <link
        rel="stylesheet"
        href="css/jadwal-admin.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

<div class="layout">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


        <div class="brand">

            <img
                src="assets/images/logo.png"
                alt="Logo IRODA"
            >

            <div class="brand-text">

                <h2>IRODA</h2>

                <span>IKATAN REMAJA RT02</span>

            </div>

        </div>


        <nav>

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>


            <a href="index.html">

                <i class="fa-solid fa-globe"></i>

                <span>Halaman Utama</span>

            </a>


            <a href="event.html">

                <i class="fa-solid fa-folder"></i>

                <span>Dokumentasi</span>

            </a>


            <a
                href="jadwal-admin.html"
                class="active"
            >

                <i class="fa-solid fa-calendar-days"></i>

                <span>Jadwal Kegiatan</span>

            </a>

        </nav>


        <button
            id="logoutButton"
            class="logout"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </button>

    </aside>



    <!-- =========================
         CONTENT
    ========================= -->

    <main class="content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <h1>Jadwal Kegiatan</h1>

                <p>
                    Kelola jadwal kegiatan IRODA.
                </p>

            </div>


            <div class="admin">

                <div
                    class="avatar"
                    id="avatar"
                >
                    A
                </div>


                <div>

                    <strong id="adminName">
                        Admin
                    </strong>

                    <span>
                        Administrator
                    </span>

                </div>

            </div>

        </header>



        <!-- =========================
             JADWAL
        ========================= -->

        <section class="schedule-section">


            <div class="section-header">

                <div>

                    <span class="section-label">
                        KEGIATAN
                    </span>

                    <h2>
                        Daftar Jadwal
                    </h2>

                    <p>
                        Tambahkan dan kelola jadwal kegiatan IRODA.
                    </p>

                </div>


                <button
                    type="button"
                    id="addScheduleButton"
                    class="primary-button"
                >

                    <i class="fa-solid fa-plus"></i>

                    Tambah Jadwal

                </button>

            </div>



            <!-- =========================
                 TABLE
            ========================= -->

            <div class="table-card">

                <div
                    id="scheduleTable"
                    class="schedule-table"
                >

                    <div class="loading">
                        Memuat jadwal...
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>



<!-- =========================
     MODAL
========================== -->

<div
    id="scheduleModal"
    class="modal"
    hidden
>

    <div class="modal-overlay"></div>


    <div class="modal-box">


        <div class="modal-header">

            <div>

                <span class="section-label">
                    JADWAL
                </span>

                <h2 id="modalTitle">
                    Tambah Jadwal
                </h2>

            </div>


            <button
                type="button"
                id="closeModal"
                class="close-modal"
                aria-label="Tutup"
            >
                ×
            </button>

        </div>



        <!-- FORM -->

        <form id="scheduleForm">


            <input
                type="hidden"
                id="scheduleId"
            >


            <div class="form-group">

                <label for="title">
                    Judul Kegiatan
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Contoh: Rapat Pengurus"
                    required
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="scheduleDate">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="scheduleDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="scheduleTime">
                        Jam
                    </label>

                    <input
                        type="time"
                        id="scheduleTime"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="location">
                    Lokasi
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Contoh: Rumah Ketua RT"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Keterangan
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Keterangan kegiatan..."
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary-button"
                >
                    Batal
                </button>


                <button
                    type="submit"
                    id="saveButton"
                    class="primary-button"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    Simpan

                </button>

            </div>


        </form>

    </div>

</div>



<script src="js/jadwal-admin.js"></script>

</body>

</html>
