    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        // ==================================================
        // LOGIN / DASHBOARD
        // ==================================================

        const authButton =
            document.getElementById("authButton");


        const isLoggedIn =
            localStorage.getItem("isLoggedIn") === "true";


        if (isLoggedIn) {

            authButton.textContent =
                "Dashboard";

            authButton.href =
                "dashboard.html";

        } else {

            authButton.textContent =
                "Login";

            authButton.href =
                "login.html";

        }



        // ==================================================
        // API APPS SCRIPT
        // ==================================================

        const PAMPHLET_API_URL =
            "https://script.google.com/macros/s/AKfycby9YqSJz1FjYPKk7fOVVMgG_z7OZS8DGd9D47Q0wWixOROD7omylyUvS-NAeGGy7I76TQ/exec";



        // ==================================================
        // ELEMENT
        // ==================================================

        const pamphletContainer =
            document.getElementById(
                "pamphletContainer"
            );


        const pamphletStatus =
            document.getElementById(
                "pamphletStatus"
            );



        // ==================================================
        // LOAD PAMFLET
        // ==================================================

        async function loadPamphlets() {

            try {

                const response =
                    await fetch(
                        PAMPHLET_API_URL
                    );


                if (!response.ok) {

                    throw new Error(
                        "Gagal menghubungi server"
                    );

                }


                const data =
                    await response.json();



                // ==========================
                // CEK RESPONSE
                // ==========================

                if (
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Gagal mengambil data pamflet"
                    );

                }


                const pamphlets =
                    Array.isArray(
                        data.pamphlets
                    )
                        ? data.pamphlets
                        : [];



                // ==========================
                // KOSONG
                // ==========================

                if (
                    pamphlets.length === 0
                ) {

                    pamphletStatus.textContent =
                        "Belum ada pamflet kegiatan.";

                    return;

                }



                // ==========================
                // HAPUS STATUS
                // ==========================

                pamphletStatus.style.display =
                    "none";



                // ==========================
                // TAMPILKAN PAMFLET
                // ==========================

                pamphlets.forEach(
                    function (pamphlet) {

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "pamphlet-card";



                        const image =
                            document.createElement(
                                "img"
                            );

                        image.src =
                            pamphlet.url;

                        image.alt =
                            pamphlet.name ||
                            "Pamflet kegiatan IRODA";

                        image.loading =
                            "lazy";



                        // ==========================
                        // LINK GAMBAR
                        // ==========================

                        const link =
                            document.createElement(
                                "a"
                            );

                        link.href =
                            pamphlet.url;

                        link.target =
                            "_blank";

                        link.rel =
                            "noopener noreferrer";



                        link.appendChild(
                            image
                        );


                        card.appendChild(
                            link
                        );


                        pamphletContainer.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Pamflet error:",
                    error
                );


                pamphletStatus.textContent =
                    "Pamflet belum dapat dimuat.";

            }

        }



        // ==================================================
        // JALANKAN
        // ==================================================

        loadPamphlets();

    </script>


</body>
